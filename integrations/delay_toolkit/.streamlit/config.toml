[theme]
base = "light"
primaryColor = "#14324A"
backgroundColor = "#FCFCFA"
secondaryBackgroundColor = "#F1F5F9"
textColor = "#14324A"
font = "sans serif"

[client]
showErrorDetails = false
toolbarMode = "minimal"

[server]
headless = true
address = "0.0.0.0"
port = 8501
baseUrlPath = "toolkit"
enableXsrfProtection = true
maxUploadSize = 75

[browser]
gatherUsageStats = false
