name: Forensic toolkit upstream sync

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: forensic-toolkit-upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve pinned and upstream revisions
        id: revisions
        shell: bash
        run: |
          set -euo pipefail
          PINNED="$(python -c 'import json; print(json.load(open("vendor/delay-analysis-toolkit.upstream.json"))["commit"])')"
          INTERFACE="$(python scripts/verify_forensic_vendor.py --print-locked-interface)"
          LATEST="$(git ls-remote https://github.com/altunozan/delay-analysis-toolkit.git refs/heads/main | cut -f1)"
          echo "pinned=$PINNED" >> "$GITHUB_OUTPUT"
          echo "interface=$INTERFACE" >> "$GITHUB_OUTPUT"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          if [ "$PINNED" = "$LATEST" ]; then echo "changed=false" >> "$GITHUB_OUTPUT"; else echo "changed=true" >> "$GITHUB_OUTPUT"; fi

      - name: Pull squashed subtree update
        if: steps.revisions.outputs.changed == 'true'
        run: |
          git subtree pull --prefix vendor/delay-analysis-toolkit https://github.com/altunozan/delay-analysis-toolkit.git main --squash -m "vendor: sync delay-analysis-toolkit ${{ steps.revisions.outputs.latest }}"

      # COAir carries one deliberate local patch on top of upstream
      # (vendor/patches/0001-coair-managed-gemini.patch): Gemini is the managed
      # provider, not NVIDIA. A subtree pull can silently take that back, and
      # the failure mode is invisible — the toolkit would keep working while
      # asking analysts for a key we do not hand out. Fail the sync loudly
      # instead, so someone re-applies the patch on purpose.
      - name: Verify the COAir local patch survived the sync
        if: steps.revisions.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd vendor/delay-analysis-toolkit
          if ! python -c "
          import sys; sys.path.insert(0, '.')
          from dcma.narrative import MANAGED_PROVIDER, PROVIDERS
          g = PROVIDERS['gemini']
          assert MANAGED_PROVIDER == 'gemini', MANAGED_PROVIDER
          assert list(PROVIDERS)[0] == 'gemini'
          assert g['default_model'] == 'gemini-flash-latest', g['default_model']
          assert g['models'][0] == 'gemini-flash-latest', g['models'][0]
          # Google closed this one to new accounts on 2026-08-06; it must not
          # come back through a sync.
          assert 'gemini-2.5-flash' not in g['models']
          assert 'nvidia' not in PROVIDERS
          "; then
            echo "::error::The upstream sync reverted the COAir managed-Gemini patch."
            echo "Re-apply it with: git apply vendor/patches/0001-coair-managed-gemini.patch"
            echo "then refresh the lock: python scripts/verify_forensic_vendor.py --update"
            exit 1
          fi

      - name: Detect upstream workflow changes
        if: steps.revisions.outputs.changed == 'true'
        id: interface
        shell: bash
        run: |
          set -euo pipefail
          CURRENT="$(python scripts/verify_forensic_vendor.py --print-interface)"
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          if [ "${{ steps.revisions.outputs.interface }}" = "$CURRENT" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Refresh vendor lock
        if: steps.revisions.outputs.changed == 'true'
        run: |
          python scripts/verify_forensic_vendor.py --update --commit "${{ steps.revisions.outputs.latest }}"

      - uses: actions/setup-python@v5
        if: steps.revisions.outputs.changed == 'true'
        with:
          python-version: "3.11"
          cache: pip

      - name: Test upstream and native adapters
        if: steps.revisions.outputs.changed == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r vendor/delay-analysis-toolkit/requirements.txt pytest
          python scripts/verify_forensic_vendor.py
          python -m compileall -q vendor/delay-analysis-toolkit backend/services/forensic_toolkit
          (cd vendor/delay-analysis-toolkit && python test_engine.py && python test_qa.py && pytest -q test_programme.py test_rlpa.py test_ui.py)
          PYTHONPATH=. pytest -q tests/test_forensic_engines.py tests/test_forensic_store.py tests/test_forensic_programme_service.py tests/test_forensic_api_models.py tests/test_forensic_actions.py
          (cd frontend && npm ci && npm run build && npx playwright install --with-deps chromium && npm run e2e:forensic)

      - uses: peter-evans/create-pull-request@v7
        id: pull-request
        if: steps.revisions.outputs.changed == 'true'
        with:
          branch: automation/forensic-toolkit-sync
          delete-branch: true
          title: "vendor: sync Delay Analysis Toolkit upstream"
          commit-message: "vendor: sync Delay Analysis Toolkit upstream"
          body: |
            Automated weekly native-engine update.

            - Previous SHA: `${{ steps.revisions.outputs.pinned }}`
            - New SHA: `${{ steps.revisions.outputs.latest }}`
            - Upstream workflow changed: `${{ steps.interface.outputs.changed }}`
            - Vendor integrity, upstream engine tests and COAir adapter parity tests passed.

            Streamlit UI changes are not copied into COAir automatically. Review engine and adapter behaviour before merging.
          labels: dependencies,forensic-toolkit

      - name: Merge engine-only compatible update
        if: >-
          steps.revisions.outputs.changed == 'true' &&
          steps.interface.outputs.changed == 'false' &&
          steps.pull-request.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr merge "${{ steps.pull-request.outputs.pull-request-number }}" --squash --delete-branch
