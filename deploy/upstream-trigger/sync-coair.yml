# Install this file as .github/workflows/sync-coair.yml in
# altunozan/delay-analysis-toolkit. It cannot be installed by the COAir account,
# which currently has read-only access to that repository.
name: Notify COAir of upstream main updates

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch COAir sync
        env:
          COAIR_TOKEN: ${{ secrets.COAIR_REPOSITORY_DISPATCH_TOKEN }}
          UPSTREAM_SHA: ${{ github.sha }}
          UPSTREAM_REPOSITORY: ${{ github.repository }}
        run: |
          test -n "$COAIR_TOKEN"
          PAYLOAD="$(jq -n \
            --arg event_type "delay-toolkit-upstream-main" \
            --arg repository "$UPSTREAM_REPOSITORY" \
            --arg sha "$UPSTREAM_SHA" \
            '{event_type: $event_type, client_payload: {repository: $repository, sha: $sha}}')"
          curl --fail-with-body --retry 3 \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $COAIR_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/kadir-sen/RAG/dispatches \
            -d "$PAYLOAD"
