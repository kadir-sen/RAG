# Serves the Delay Analysis Toolkit at /toolkit/ from the same origin as COAir.
#
# Included inside the existing COAir server block by
# deploy/install_toolkit_nginx.sh. It must come before the catch-all that
# proxies to the API: FastAPI answers every unmatched path with the React
# index.html (backend/main.py: serve_spa), so without this block /toolkit/
# renders a COAir 404 instead of the Streamlit app.

location = /toolkit {
    return 302 /toolkit/;
}

location /toolkit/ {
    proxy_pass http://127.0.0.1:8501;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Streamlit talks over a websocket (/toolkit/_stcore/stream). Without the
    # upgrade headers the page loads and then hangs on "Connecting…".
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # A DCMA or windows run on a large programme holds the connection open
    # while it computes.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # Streamlit streams its reruns; buffering them delays every screen update.
    proxy_buffering off;

    # Matches the toolkit's own maxUploadSize = 400 (its .streamlit/config.toml).
    # Set lower and nginx rejects a big XER with 413 before Streamlit ever sees
    # it, which reads to the analyst as the app being broken.
    client_max_body_size 450m;
}
